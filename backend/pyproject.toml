[project]
name = "finhub-backend"
version = "0.4.0"
description = "Local engine service for FinHub: data, reasoning agent, analytics and market simulator behind one API."
license = "Apache-2.0"
authors = [{ name = "Adib Molla" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "numpy>=2.0",
    "mcp>=1.10",
    "tzdata>=2024.1; sys_platform == 'win32'",  # Windows has no time zone database for zoneinfo
]

# Engines (OpenBB, Vibe-Trading, ...) are NOT dependencies of the backend. Each lives in its own
# isolated environment under ../engines/<id>/, because they pin conflicting versions of shared
# libraries (e.g. fastmcp). The backend talks to them as separate processes.

[project.scripts]
finhub-backend = "finhub_backend.server:run"
finhub-mcp = "finhub_backend.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# Installed apps run `uv sync` over the environment from the previous version. By default uv only reinstalls
# this project when pyproject.toml's modified time changes, and builds keep that time, so an upgrade would keep
# running the old backend. Watch the source as well.
cache-keys = [{ file = "pyproject.toml" }, { file = "uv.lock" }, { file = "src/**/*.py" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
