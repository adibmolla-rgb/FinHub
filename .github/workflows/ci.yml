name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q

  engines:
    # Installs each engine on a clean machine and checks it imports: catches install breakage
    # before users hit it.
    name: Engines install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: engines/openbb
      - name: Data worker tests
        run: uv run pytest -q
        working-directory: engines/openbb
      - run: uv sync
        working-directory: engines/vibe-trading
      - run: uv sync
        working-directory: backend
      - name: Warm up OpenBB (its first import builds an index and takes a while)
        run: uv run python -c "from openbb import obb; print('openbb ready')"
        working-directory: engines/openbb
      - name: Every engine must report ready
        working-directory: backend
        run: >
          uv run python -c "from finhub_backend import engines;
          s = engines.statuses(); [print(x.id, x.available, x.version, x.reason) for x in s];
          raise SystemExit(0 if all(x.available for x in s) else 1)"

  app:
    name: Desktop app build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6  # the app bundles uv; the staging script copies it from PATH
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: finhub-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: ignore
