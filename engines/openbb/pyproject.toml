[project]
name = "finhub-engine-openbb"
version = "0.1.0"
description = "Isolated environment for the OpenBB data engine. Kept separate because engines pin conflicting dependencies."
requires-python = ">=3.12,<3.14"
dependencies = [
    "openbb>=5.0",
    # OpenBB 5 ships routers separately; these are the Apache-2.0 ones FinHub uses.
    "openbb-equity>=2.0",
    "openbb-news>=2.0",
    "openbb-economy>=2.0",
    "openbb-etf>=2.0",
    "openbb-index>=2.0",
    "openbb-derivatives>=2.0",
    "openbb-fixedincome>=2.0",
    # Yahoo Finance via the Apache-2.0 yfinance library directly. OpenBB's own yfinance extension is
    # AGPL-3.0, so FinHub does not depend on it.
    "yfinance>=0.2.50",
    "edgartools>=5.62",
    "financedatabase>=2.5",
]

[tool.uv]
package = false
# edgartools asks for the GPL unidecode package. FinHub only depends on Apache, MIT and BSD code, so this keeps it out
# and unidecode.py stands in for the one function edgartools uses.
override-dependencies = ["unidecode; sys_platform == 'never'"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
